name: Sync OpenWrt v25.12.2

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v4
        with:
          repository: RaspberryMod/V25.12.2
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git rsync curl wget unzip zip tar gzip bzip2 xz-utils zstd \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext libncurses5-dev libssl-dev \
            python3 python3-pip python3-setuptools python3-distutils python3-dev \
            file patch pkgconf ccache ca-certificates jq tree dos2unix

      - name: Configure Git
        run: |
          git config --global user.name "dotywrt"
          git config --global user.email "dotywrt@gmail.com"

      - name: Show System Info
        run: |
          uname -a
          lsb_release -a || true
          git status
          git branch --show-current
          df -h

      - name: Clone OpenWrt v25.12.2
        run: |
          rm -rf /tmp/openwrt
          git clone \
            --depth=1 \
            --branch v25.12.2 \
            https://github.com/openwrt/openwrt.git \
            /tmp/openwrt

      - name: Add Custom Feed
        run: |
          sed -i '1i src-git dotywrt_pkg https://github.com/AW1Kdev/wp.git' \
            /tmp/openwrt/feeds.conf.default

          cat /tmp/openwrt/feeds.conf.default

      - name: Normalize Scripts
        run: |
          find /tmp/openwrt \
            -type f \
            \( -name "*.sh" -o -name "*.txt" \) \
            -exec dos2unix {} \; \
            -exec chmod +x {} \;

      - name: Clean Current Repo
        run: |
          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

      - name: Copy OpenWrt Source
        run: |
          rsync -a \
            --delete \
            --exclude='.git' \
            --exclude='.github' \
            /tmp/openwrt/ \
            ./

      - name: Show OpenWrt Version
        run: |
          cat version.date 2>/dev/null || true
          cat version 2>/dev/null || true
          git log -1 --oneline || true

      - name: Commit Changes
        run: |
          git add .
          git commit -m "Sync OpenWrt v25.12.2 with dotywrt feed" || echo "No changes"

      - name: Push Changes
        run: |
          git push origin HEAD:main
